apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdc-rtc
  namespace: default
  labels:
    app: sdc-rtc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdc-rtc
  template:
    metadata:
      labels:
        app: sdc-rtc
    spec:
      containers:
        - name: sdc-rtc
          image: sdc-rtc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xai-api-secret
                  key: XAI_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:  # Uses Actuator /actuator/health (no external calls)
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:  # Uses Actuator /actuator/health (no external calls)
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6