spring.application.name=sdc-rtc

# Cache configuration (Caffeine is configured in CacheConfig.java)
spring.cache.cache-names=dailyChoice

# xAI API configuration - set XAI_API_KEY environment variable
xai.api.key=${XAI_API_KEY:}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.sdcrtc=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Server
server.port=8080
server.compression.enabled=true
