apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdc-rtc
  namespace: default
  labels:
    app: sdc-rtc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdc-rtc
  template:
    metadata:
      labels:
        app: sdc-rtc
    spec:
      containers:
      - name: sdc-rtc
        image: sdc-rtc:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: xai-api-secret
              key: XAI_API_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: xai-api-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded XAI_API_KEY value should be placed here in production
  XAI_API_KEY: eW91ci1hcGkta2V5LWhlcmU=  # replace with real base64(XAI_API_KEY)
