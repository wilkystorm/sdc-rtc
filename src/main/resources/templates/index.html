<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Daily Choice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --primary: 234 179 8;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
        }

        .quote {
            font-size: 1.15rem;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center">
    <div class="max-w-2xl mx-auto px-6 py-12">
        <!-- Header -->
        <div class="flex justify-between items-center mb-16">
            <div class="flex items-center gap-x-3">
                <div class="w-8 h-8 bg-yellow-400 rounded-2xl flex items-center justify-center text-zinc-950 font-bold text-xl">S</div>
                <div>
                    <span class="heading text-2xl font-semibold tracking-tighter">small daily choice</span>
                </div>
            </div>
            <div class="text-xs uppercase tracking-[2px] font-medium text-zinc-500">reduce tribal contempt</div>
        </div>

        <!-- Main Content -->
        <div class="card bg-zinc-900 border border-zinc-800 rounded-3xl p-10 shadow-2xl">
            <div class="flex flex-col items-center text-center">
                <!-- Date -->
                <div class="inline-flex items-center gap-x-2 bg-zinc-800 text-yellow-400 text-sm font-medium px-5 py-2 rounded-2xl mb-8">
                    <span class="w-2 h-2 bg-current rounded-full animate-pulse"></span>
                    TODAY • <span th:text="${date}"></span>
                </div>

                <!-- Choice -->
                <div class="max-w-md">
                    <div class="text-amber-300 mb-3 text-sm font-medium tracking-widest">THE CHOICE</div>
                    <p class="quote text-2xl leading-relaxed text-zinc-100 font-light" 
                       th:text="${choice}">
                    </p>
                </div>

                <!-- Divider -->
                <div class="w-16 h-px bg-gradient-to-r from-transparent via-zinc-700 to-transparent my-12"></div>

                <!-- Message -->
                <div class="text-zinc-400 text-sm max-w-xs leading-relaxed">
                    One small act of understanding today can ripple outward.<br>
                    Choose wisely. Repeat tomorrow.
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-12 text-center">
            <div class="flex justify-center gap-x-8 text-xs text-zinc-500">
                <a href="/api/today" target="_blank" 
                   class="hover:text-yellow-400 transition-colors flex items-center gap-x-1">
                    <span>→</span>
                    <span>GET /api/today</span>
                </a>
                <div class="text-zinc-600">•</div>
                <div>Built with Spring Boot + xAI Grok</div>
            </div>
            <div class="mt-8 text-[10px] text-zinc-700">
                The daily choice is generated fresh each day by Grok-4.5
            </div>
        </div>
    </div>

    <script>
        // Tailwind script already loaded via CDN
        function initTailwind() {
            // Any dynamic behavior if needed
        }
        window.onload = initTailwind;
    </script>
</body>
</html>
